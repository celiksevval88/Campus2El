<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            Kampus2El
        </a>
    </div>
</nav>

<!-- FORM -->
<section class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Kayıt Ol</h2>

                <form onsubmit="event.preventDefault(); kayitOl();">

                    <!-- AD SOYAD -->
                    <div class="mb-3">
                        <label class="form-label">Ad Soyad</label>
                        <input type="text"
                               id="adSoyad"
                               class="form-control"
                               placeholder="Adınızı girin"
                               required>
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label">E-Posta</label>
                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="ornek@mail.com"
                               required>
                    </div>

                    <!-- ŞİFRE -->
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password"
                               id="sifre"
                               class="form-control"
                               placeholder="Şifre oluşturun"
                               required>
                    </div>

                    <!-- ŞİFRE TEKRAR -->
                    <div class="mb-3">
                        <label class="form-label">Şifre Tekrar</label>
                        <input type="password"
                               id="sifreTekrar"
                               class="form-control"
                               placeholder="Şifreyi tekrar girin"
                               required>
                    </div>

                    <!-- BUTON -->
                    <button type="submit" class="btn btn-dark w-100">
                        Kayıt Ol
                    </button>

                </form>

                <p class="text-center mt-3">
                    Zaten hesabın var mı?
                    <a href="giris.html">Giriş Yap</a>
                </p>

            </div>

        </div>

    </div>

</section>

<script src="js/script.js"></script>

<script>
// =========================
// KAYIT OL FONKSİYONU
// =========================
function kayitOl() {

    const adSoyad = document.getElementById("adSoyad").value;
    const email = document.getElementById("email").value;
    const sifre = document.getElementById("sifre").value;
    const sifreTekrar = document.getElementById("sifreTekrar").value;

    if (!adSoyad || !email || !sifre || !sifreTekrar) {
        alert("Tüm alanları doldur!");
        return;
    }

    if (sifre !== sifreTekrar) {
        alert("Şifreler uyuşmuyor!");
        return;
    }

    // kullanıcı listesi
    let users = JSON.parse(localStorage.getItem("users")) || [];

    // email kontrol
    let mevcut = users.find(u => u.email === email);

    if (mevcut) {
        alert("Bu e-posta zaten kayıtlı!");
        return;
    }

    const yeniUser = {
        id: Date.now(),
        adSoyad,
        email,
        sifre
    };

    users.push(yeniUser);

    localStorage.setItem("users", JSON.stringify(users));

    alert("Kayıt başarılı! Giriş sayfasına yönlendiriliyorsun...");

    window.location.href = "giris.html";
}
</script>

</body>
</html>
