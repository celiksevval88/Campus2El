<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Ekle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Kampus2El</a>
    </div>
</nav>

<!-- FORM -->
<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h3 class="text-center mb-4">İlan Ekle</h3>

                <form id="ilanForm">

                    <!-- BAŞLIK -->
                    <input type="text"
                           id="baslik"
                           class="form-control mb-3"
                           placeholder="İlan Başlığı"
                           required>

                    <!-- AÇIKLAMA -->
                    <textarea id="aciklama"
                              class="form-control mb-3"
                              placeholder="Açıklama"
                              rows="4"
                              required></textarea>

                    <!-- FİYAT -->
                    <input type="number"
                           id="fiyat"
                           class="form-control mb-3"
                           placeholder="Fiyat"
                           required>

                    <!-- KATEGORİ -->
                    <select id="kategori" class="form-select mb-3" required>
                        <option value="Elektronik">Elektronik</option>
                        <option value="Ders Notu">Ders Notu</option>
                        <option value="Bisiklet">Bisiklet</option>
                        <option value="Ev Eşyası">Ev Eşyası</option>
                    </select>

                    <!-- FOTO SEÇ -->
                    <div class="mb-3">
                        <label class="form-label">İlan Görseli</label>
                        <input type="file"
                               id="resim"
                               class="form-control"
                               accept="image/*">
                    </div>

                    <!-- BUTON -->
                    <button type="submit" class="btn btn-dark w-100">
                        İlanı Yayınla
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
