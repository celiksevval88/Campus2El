<!-- HERO -->
<section class="hero text-white d-flex align-items-center text-center">

    <div class="container">

        </a>

<!-- SON İLANLAR -->
<section class="container my-5">

    <h2 class="text-center mb-4">Son Eklenen İlanlar</h2>

    <div class="row" id="sonIlanlar"></div>

</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3">
    © 2026 Kampus2El - Tüm Hakları Saklıdır
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

<script>
// =========================
// SON İLANLAR (INDEX ÖZEL)
// =========================
document.addEventListener("DOMContentLoaded", function () {

    const box = document.getElementById("sonIlanlar");

    if (!box) return;

    let ilanlar = JSON.parse(localStorage.getItem("ilanlar")) || [];

    // son 3 ilan
    let sonlar = ilanlar.slice(-3).reverse();

    box.innerHTML = "";

    sonlar.forEach(ilan => {

        box.innerHTML += `
            <div class="col-md-4 mb-4">

                <div class="card shadow h-100">

                    <img src="${ilan.resim || 'https://picsum.photos/400/250'}"
     class="card-img-top">

                    <div class="card-body d-flex flex-column">

                        <h5>${ilan.baslik}</h5>
                        <p>${ilan.aciklama}</p>

                        <h4 class="text-primary">${ilan.fiyat} ₺</h4>

                        <a href="ilan-detay.html?id=${ilan.id}"
                           class="btn btn-dark mt-auto">
                           Detay Gör
                        </a>

                    </div>

                </div>

            </div>
        `;
    });

});
</script>

</body>
