<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesajlaşma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Kampus2El</a>
    </div>
</nav>

<!-- CHAT ALANI -->
<div class="container mt-4">

    <h3>💬 Mesajlaşma</h3>

    <!-- 🔥 SOHBET LİSTESİ (YENİ EKLENDİ) -->
    <div id="sohbetListesi" class="mb-3"></div>

    <!-- KARŞI TARAF -->
    <div class="alert alert-secondary mt-3">
        <b>Konuştuğun kişi:</b>
        <span id="chatKisi">-</span>
    </div>

    <!-- MESAJ LİSTESİ -->
    <div id="mesajListesi"
         class="border p-3 mb-3"
         style="height:300px; overflow:auto; background:#fff; border-radius:10px;">
    </div>

    <!-- INPUT -->
    <input id="mesaj"
           class="form-control mb-2"
           placeholder="Mesaj yaz...">

    <!-- BUTTON -->
    <button class="btn btn-dark w-100" onclick="mesajGonder()">
        Gönder
    </button>

</div>

<script src="js/script.js"></script>

<script>
// =========================
// CHAT SAYFASI YÜKLE
// =========================
document.addEventListener("DOMContentLoaded", function () {

    const user = localStorage.getItem("currentUser");

    if (!user) {
        alert("Önce giriş yap!");
        window.location.href = "giris.html";
        return;
    }

    // 🔥 YENİ: sohbetleri listele
    sohbetleriListele();

    // mesajları yükle
    mesajlariGoster();

    const alici = localStorage.getItem("sohbetAlici");

    if (alici) {
        document.getElementById("chatKisi").innerText = alici;
    } else {
        document.getElementById("chatKisi").innerText = "Bilinmiyor";
    }
});
</script>

</body>
</html>
