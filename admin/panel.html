<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Admin Panel</a>
    </div>
</nav>

<div class="container my-4">
    <h2>📊 Tüm İlanlar (Yönetici)</h2>
</div>

<div class="container">
    <div class="row" id="adminIlanlar"></div>
</div>

<script src="../js/script.js"></script>

<script>
// =========================
// ADMIN PANEL LOAD
// =========================
document.addEventListener("DOMContentLoaded", function () {

    const adminBox = document.getElementById("adminIlanlar");

    // rol kontrol
    const rol = localStorage.getItem("rol");

    if (rol !== "admin") {
        alert("Yetkisiz giriş!");
        window.location.href = "../index.html";
        return;
    }

    let ilanlar = JSON.parse(localStorage.getItem("ilanlar")) || [];

    adminBox.innerHTML = "";

    ilanlar.forEach(ilan => {

        adminBox.innerHTML += `
            <div class="col-md-4 mb-3">
                <div class="card shadow h-100">

                    <div class="card-body">

                        <h5>${ilan.baslik}</h5>
                        <p>${ilan.aciklama}</p>

                        <h4 class="text-primary">${ilan.fiyat} ₺</h4>

                        <p><b>Kategori:</b> ${ilan.kategori}</p>
                        <p><small>${ilan.userEmail}</small></p>

                        <button class="btn btn-danger w-100"
                                onclick="adminIlanSil(${ilan.id})">
                            İlanı Sil
                        </button>

                    </div>

                </div>
            </div>
        `;
    });

});

// =========================
// ADMIN İLAN SİL
// =========================
function adminIlanSil(id) {

    let ilanlar = JSON.parse(localStorage.getItem("ilanlar")) || [];

    ilanlar = ilanlar.filter(i => i.id !== id);

    localStorage.setItem("ilanlar", JSON.stringify(ilanlar));

    location.reload();
}
</script>

</body>
</html>
